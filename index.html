<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Timeline FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,500;1,300&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<!-- ===== LOADING ===== -->
<div id="loading" class="screen active">
  <div class="spinner" id="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Connecting to SpotifyвЂ¦</div>
  <div id="loading-error" style="display:none;text-align:center;max-width:340px;padding:0 24px">
    <div class="error-box" id="loading-error-msg"></div>
    <button class="btn btn-spotify" onclick="loginWithSpotify()" style="margin-top:20px">
      <svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      Try Again
    </button>
  </div>
</div>

<!-- ===== PLAYLIST PICKER ===== -->
<div id="picker" class="screen">
  <div class="screen-header">
    <div>
      <div style="font-size:9px;letter-spacing:0.3em;color:var(--teal);text-transform:uppercase;margin-bottom:2px">Timeline FM</div>
      <div class="screen-title">Pick a Playlist</div>
    </div>
    <div class="user-badge">
      <img class="user-avatar" id="user-avatar" src="" alt="" onerror="this.style.display='none'">
      <span class="user-name" id="user-name"></span>
    </div>
  </div>
  <div class="screen-content">
    <input type="text" id="playlist-search" placeholder="рџ”Ќ  Search Spotify playlistsвЂ¦" oninput="onSearchInput(this.value)" style="margin-bottom:16px">
    <div class="playlist-grid" id="playlist-grid">
      <div class="empty-state">Loading playlistsвЂ¦</div>
    </div>
  </div>
  <div class="picker-footer" style="flex-direction:column;align-items:stretch;gap:10px">
    <div style="display:flex;gap:8px">
      <button class="mode-btn active" id="mode-standard" onclick="setMode('standard')">в™џ Standard</button>
      <button class="mode-btn" id="mode-hardcore" onclick="setMode('hardcore')">в  Hardcore</button>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-end">
      <div class="num-input-wrap">
        <label>Pool</label>
        <input type="number" id="num-pool" value="50" min="10" max="100">
      </div>
      <div class="num-input-wrap">
        <label>Win at</label>
        <input type="number" id="num-win" value="20" min="5" max="50">
      </div>
      <button class="btn btn-ghost" onclick="logout()" style="margin-left:auto;padding:10px 14px">Log out</button>
    </div>
    <button class="btn btn-primary" id="start-btn" onclick="startGame()" style="width:100%">в™џ Play Standard</button>
  </div>
</div>

<!-- ===== GAME ===== -->
<div id="game" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="quitGame()">в†ђ</button>
    <div class="pl-badge" id="g-pl-name"></div>
    <div class="hdr-pills">
      <span class="hdr-pill hdr-counter" id="g-counter"></span>
      <span class="hdr-pill hdr-token" id="token-wrap" style="display:none">в™Ґ <span id="token-count">3</span></span>
      <span class="hdr-pill hdr-score">в… <span id="g-score">0</span></span>
    </div>
  </div>

  <div class="game-body">
    <!-- Timeline -->
    <div class="timeline-section">
      <div class="section-label">Your Timeline</div>
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="divider"></div>

    <!-- Current card -->
    <div class="current-section">
      <div class="current-label">Current Card</div>

      <div class="vinyl-wrap" id="vinyl-wrap">
        <img class="album-art" id="album-art" src="" alt="">
        <div class="vinyl-disc hidden-label" id="vinyl-disc">
          <div class="vinyl-label">
            <div class="label-title-text" id="lbl-title">?</div>
            <div class="label-year-text" id="lbl-year">????</div>
          </div>
        </div>
      </div>

      <div class="song-info-block">
        <img id="revealed-art" src="" alt="" style="display:none;width:88px;height:88px;object-fit:cover;border-radius:4px;margin-bottom:10px;box-shadow:4px 4px 0 rgba(0,0,0,0.5)">
        <div class="song-title-big" id="g-title">вЂ”</div>
        <div class="song-artist-sm" id="g-artist"></div>
        <div class="song-year-big hidden" id="g-year"></div>
      </div>

      <!-- Spotify player -->
      <div class="spotify-player" id="spotify-player">
        <div class="player-status" id="player-status">Searching for SpotifyвЂ¦</div>
        <button class="player-btn" id="refresh-devices-btn" onclick="retryDevices()" title="Refresh Devices" style="background:rgba(255,255,255,0.08);color:var(--cream);width:34px;height:34px;font-size:16px;margin-right:-4px">в†є</button>
        <button class="player-btn" id="play-btn" onclick="togglePlayback()" title="Play/Pause">в–¶</button>
      </div>
      <div id="no-device-banner" style="display:none;background:#2d1a00;border:1px solid rgba(255,140,0,0.35);padding:9px 14px;margin-top:6px;width:100%;max-width:340px;font-size:11px;color:#ffb347;letter-spacing:0.06em;display:none;align-items:center;gap:10px;flex-shrink:0;">
        <span style="flex:1">Open Spotify on your phone to enable playback</span>
        <button onclick="retryDevices()" style="background:rgba(255,140,0,0.2);border:1px solid rgba(255,140,0,0.5);color:#ffb347;padding:5px 12px;font-size:11px;cursor:pointer;white-space:nowrap;">Retry</button>
      </div>
    </div>
  </div>

  <div class="result-banner" id="result-banner"></div>

  <div class="game-controls" id="game-controls"></div>
</div>

<!-- ===== GAME OVER ===== -->
<div id="gameover" class="screen">
  <div id="go-mode" style="font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:-8px"></div>
  <div class="go-title" id="go-title">GAME OVER</div>
  <div class="go-score" id="go-score"></div>
  <div class="go-context" id="go-context"></div>
  <div id="go-playlist" style="display:none;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--teal);margin-top:-6px"></div>
  <div id="go-token-stats" style="display:none;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.08em;margin-top:4px"></div>
  <div id="go-eliminated-card" style="display:none;text-align:center;margin-top:12px;max-width:320px"></div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:24px">
    <button class="btn btn-primary" onclick="startGame()">в–¶ Play Again</button>
    <button class="btn btn-secondary" onclick="stopPlayback();goTo('picker')">Change Playlist</button>
  </div>
</div>

<script defer src="js/config.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/playlist.js"></script>
<script defer src="js/playback.js"></script>
<script defer src="js/musicbrainz.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/game.js"></script>
<script defer src="js/autocomplete.js"></script>
</body>
</html>
