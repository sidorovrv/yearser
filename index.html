<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Timeline FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,500;1,300&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --cream: #f5f0e8;
    --red: #e63329;
    --gold: #d4a843;
    --teal: #1DB954; /* Spotify green */
    --vinyl: #1a1a2e;
    --groove: #111122;
    --vinyl-size: min(clamp(60px, 18vh, 120px), clamp(60px, 38vw, 120px));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  .screen { display: none; height: 100vh; height: 100dvh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== SETUP / CONFIG SCREEN ===== */
  #setup {
    align-items: center; justify-content: center;
    padding: 40px 24px;
    overflow-y: auto;
    background: radial-gradient(ellipse at 50% 0%, #0d2818 0%, var(--black) 65%);
  }

  .setup-inner { width: 100%; max-width: 480px; }

  .logo-block { margin-bottom: 48px; text-align: center; }

  .logo-line {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(72px, 18vw, 130px);
    letter-spacing: 0.05em;
    line-height: 0.85;
    color: var(--cream);
    text-shadow: 5px 5px 0 var(--teal), 10px 10px 0 rgba(29,185,84,0.2);
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--teal);
    text-transform: uppercase;
    margin-top: 10px;
  }

  .setup-card {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    padding: 32px;
    margin-bottom: 20px;
  }

  .setup-card-title {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }

  .step-row {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    align-items: flex-start;
  }

  .step-num {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    color: var(--teal);
    line-height: 1;
    min-width: 24px;
  }

  .step-text { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  .step-text a { color: var(--teal); }
  .step-text code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    font-size: 11px;
    color: var(--gold);
  }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: var(--cream);
    padding: 14px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus { border-color: var(--teal); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: translateY(2px); }

  .btn-spotify {
    background: var(--teal);
    color: var(--black);
    font-weight: 600;
    box-shadow: 4px 4px 0 rgba(29,185,84,0.3);
    width: 100%;
  }

  .btn-spotify:hover:not(:disabled) { box-shadow: 6px 6px 0 rgba(29,185,84,0.4); transform: translate(-2px,-2px); }

  .btn-primary {
    background: var(--red);
    color: var(--cream);
    box-shadow: 4px 4px 0 var(--gold);
  }

  .btn-primary:hover:not(:disabled) { box-shadow: 6px 6px 0 var(--gold); transform: translate(-2px,-2px); }

  .btn-secondary {
    background: transparent;
    color: var(--cream);
    border: 1.5px solid rgba(255,255,255,0.2);
  }

  .btn-secondary:hover { background: rgba(255,255,255,0.05); }

  .btn-ghost {
    background: transparent;
    color: var(--gold);
    border: 1.5px solid var(--gold);
    font-size: 11px;
    padding: 10px 24px;
  }

  .spotify-icon {
    width: 20px; height: 20px;
    fill: var(--black);
  }

  /* ===== PLAYLIST PICKER ===== */
  #picker {
    background: var(--black);
  }

  .screen-header {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .back-btn {
    background: none; border: none;
    color: var(--gold); font-size: 22px;
    cursor: pointer; padding: 0;
    transition: transform 0.15s;
  }

  .back-btn:hover { transform: translateX(-4px); }

  .screen-title {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(26px, 7vw, 36px);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .user-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--teal);
    object-fit: cover;
  }

  .user-name { font-size: 11px; color: rgba(255,255,255,0.5); }

  .screen-content { flex: 1; padding: 16px 20px; overflow-y: auto; min-height: 0; }
  .screen-content::-webkit-scrollbar { width: 4px; }
  .screen-content::-webkit-scrollbar-track { background: transparent; }
  .screen-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 2px; }
  .screen-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

  /* Playlist list */
  .playlist-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .pl-card {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: all 0.15s;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .pl-card:hover { border-color: var(--teal); background: rgba(255,255,255,0.07); }
  .pl-card.selected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(29,185,84,0.25); background: rgba(29,185,84,0.06); }

  .pl-img {
    width: 52px; height: 52px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
    background: #1a1a2e;
  }

  .pl-img-placeholder {
    width: 52px; height: 52px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1a1a2e, #0d2818);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .pl-info { padding: 8px 12px; flex: 1; min-width: 0; }

  .pl-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .pl-count { font-size: 10px; color: rgba(255,255,255,0.35); }

  .picker-footer {
    padding: 12px 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .num-input-wrap { display: flex; flex-direction: column; gap: 6px; }

  input[type="number"] {
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: var(--cream);
    padding: 10px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    outline: none;
    width: 90px;
  }

  input[type="number"]:focus { border-color: var(--teal); }

  /* ===== GAME SCREEN ===== */
  #game { background: var(--black); }

  .game-header {
    padding: 7px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .pl-badge {
    flex: 1;
    min-width: 0;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--teal);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hdr-pills { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .hdr-pill { font-family: 'Bebas Neue', cursive; font-size: 15px; line-height: 1; padding: 0 7px; height: 26px; display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
  .hdr-counter { font-family: 'DM Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.3); padding: 0 6px; border-color: rgba(255,255,255,0.07); }
  .hdr-token { color: var(--teal); border-color: rgba(29,185,84,0.25); background: rgba(29,185,84,0.08); }
  .hdr-score { color: var(--gold); border-color: rgba(212,168,67,0.25); background: rgba(212,168,67,0.06); }

  .game-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  /* Timeline */
  .timeline-section {
    padding: 8px 10px 0;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    margin-bottom: 4px;
  }

  .timeline {
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding-bottom: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
    min-height: 72px;
  }

  .drop-zone {
    width: 40px;
    min-height: 88px;
    border: 2px dashed rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 16px;
    color: rgba(255,255,255,0.15);
  }

  .drop-zone:hover, .drop-zone.active {
    border-color: var(--teal);
    background: rgba(29,185,84,0.08);
    color: var(--teal);
  }

  .t-card {
    width: 80px;
    min-height: 80px;
    padding: 8px 6px;
    text-align: center;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    background: rgba(255,255,255,0.02);
  }

  .t-card.just-placed { animation: cardPop 0.3s ease; }

  @keyframes cardPop {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  .t-vinyl {
    width: 26px; height: 26px;
    border-radius: 50%;
    margin: 0 auto 5px;
    background: repeating-radial-gradient(circle at 50%, #222 0px, #333 1px, #222 2px);
    display: flex; align-items: center; justify-content: center;
  }

  .t-vinyl::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--cream); opacity: 0.5; }

  .t-year { font-family: 'Bebas Neue', cursive; font-size: 20px; color: var(--gold); line-height: 1; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  .t-title { font-size: 8px; color: rgba(255,255,255,0.92); margin-top: 3px; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
  .t-artist { font-size: 7px; color: rgba(255,255,255,0.65); margin-top: 1px; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }

  .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 5px 12px; flex-shrink: 0; }

  /* Current card */
  .current-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px 8px;
    min-height: 0;
    overflow: hidden;
  }

  .current-label { font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 2px; }

  /* Vinyl disc */
  .vinyl-wrap {
    position: relative;
    margin-bottom: 6px;
    flex-shrink: 0;
    width: var(--vinyl-size);
    height: var(--vinyl-size);
    min-width: 60px;
    min-height: 60px;
  }

  .vinyl-disc {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at 50%,
      #0d0d1a 0px, #1a1a2e 3px, #0d0d1a 5px, #1a1a2e 8px
    );
    box-shadow: 0 0 30px rgba(29,185,84,0.12), inset 0 0 15px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    animation: float 3s ease-in-out infinite;
    position: relative;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .vinyl-disc.playing { animation: playingPulse 1.5s ease-in-out infinite; }

  @keyframes playingPulse {
    0%,100% { box-shadow: 0 0 30px rgba(29,185,84,0.15); }
    50% { box-shadow: 0 0 50px rgba(29,185,84,0.4); }
  }

  .vinyl-disc.spinning { animation: discSpin 0.8s linear infinite; }
  @keyframes discSpin { to { transform: rotate(360deg); } }

  .vinyl-label {
    width: 40%; height: 40%;
    border-radius: 50%;
    background: var(--cream);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 4px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .vinyl-disc.hidden-label .vinyl-label {
    background: var(--red);
  }

  .label-title-text {
    font-family: 'Bebas Neue', cursive;
    font-size: 8px;
    color: var(--black);
    line-height: 1.1;
    max-height: 24px;
    overflow: hidden;
  }

  .label-year-text {
    font-family: 'Bebas Neue', cursive;
    font-size: 13px;
    color: var(--black);
    line-height: 1;
    margin-top: 1px;
  }

  .vinyl-disc.hidden-label .label-title-text,
  .vinyl-disc.hidden-label .label-year-text {
    visibility: hidden;
  }

  /* Album art overlay */
  .album-art {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }

  .album-art.visible { opacity: 0.15; }

  /* Song info */
  .song-info-block {
    text-align: center;
    margin-bottom: 4px;
    flex-shrink: 0;
    max-width: 100%;
  }

  .song-title-big {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 4.5vw, 22px);
    font-style: italic;
    margin-bottom: 2px;
    line-height: 1.2;
  }

  .song-artist-sm { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; }

  .song-year-big {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(28px, 6vh, 40px);
    color: var(--gold);
    line-height: 1;
    margin-top: 2px;
    transition: opacity 0.3s;
  }

  .song-year-big.hidden { opacity: 0; pointer-events: none; }

  /* Spotify mini player */
  .spotify-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(29,185,84,0.08);
    border: 1px solid rgba(29,185,84,0.2);
    padding: 7px 14px;
    margin-bottom: 8px;
    width: 100%;
    max-width: 340px;
    flex-shrink: 0;
  }

  .player-status { font-size: 10px; color: var(--teal); letter-spacing: 0.1em; flex: 1; }

  .player-btn {
    background: var(--teal);
    border: none;
    color: var(--black);
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.1s;
    flex-shrink: 0;
  }

  .player-btn:hover { transform: scale(1.1); }
  .player-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Controls */
  .game-controls {
    padding: 0 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .controls-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Result banner */
  .result-banner {
    display: none;
    padding: 7px 14px;
    text-align: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 19px;
    letter-spacing: 0.07em;
    flex-shrink: 0;
    animation: bannerIn 0.25s ease;
  }

  @keyframes bannerIn { from { opacity:0; transform:scaleY(0.7); } to { opacity:1; transform:scaleY(1); } }
  .result-banner.correct { background: #0d3320; color: var(--teal); display: block; border-top: 1px solid rgba(29,185,84,0.3); }
  .result-banner.wrong { background: #2d0d0a; color: var(--red); display: block; border-top: 1px solid rgba(230,51,41,0.3); }

  @keyframes ghostPulse {
    0%,100% { border-color: rgba(29,185,84,0.5); box-shadow: 0 0 10px rgba(29,185,84,0.1); }
    50% { border-color: var(--teal); box-shadow: 0 0 22px rgba(29,185,84,0.45); }
  }
  .t-card-ghost { animation: ghostPulse 1.1s ease-in-out infinite; }
  .pl-section-label { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 10px; grid-column: 1 / -1; padding-top: 4px; }

  /* ===== GAME OVER ===== */
  #gameover {
    align-items: center; justify-content: center;
    padding: clamp(14px, 5vh, 36px) 20px; gap: clamp(6px, 1.5vh, 14px); text-align: center;
    overflow-y: auto;
    background: radial-gradient(ellipse at 50% 40%, #0d2818, var(--black) 65%);
  }
  #gameover::-webkit-scrollbar { width: 4px; }
  #gameover::-webkit-scrollbar-track { background: transparent; }
  #gameover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 2px; }

  .go-title { font-family: 'Bebas Neue', cursive; font-size: clamp(40px,min(13vw,11vh),100px); letter-spacing:0.05em; text-shadow: 5px 5px 0 var(--teal); animation: fadeDown 0.5s ease; }
  .go-score { font-family: 'Bebas Neue', cursive; font-size: clamp(40px, 9vh, 70px); color: var(--gold); line-height: 1; }
  .go-context { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.12em; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }

  /* ===== LOADING ===== */
  #loading {
    align-items: center; justify-content: center;
    background: var(--black);
    gap: 20px;
  }

  .spinner {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: var(--teal);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 12px; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }

  /* Misc */
  .mt16 { margin-top: 16px; }
  .empty-state { text-align:center; padding:48px; color:rgba(255,255,255,0.2); }
  .error-box { background: #2d0d0a; border: 1px solid rgba(230,51,41,0.3); padding: 14px 18px; font-size: 12px; color: #ff9b97; margin-top: 12px; }

  .mode-btn { padding: 8px 22px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; border: 1.5px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.15s; }
  .mode-btn:hover { border-color: rgba(255,255,255,0.4); color: var(--cream); }
  .mode-btn.active { border-color: var(--teal); color: var(--teal); background: rgba(29,185,84,0.1); }
  .mode-btn.active-red { border-color: var(--red); color: var(--red); background: rgba(230,51,41,0.1); }
  .ac-wrap { position: relative; }

<script>
// ============================================================
//  CONFIG
//  HARDCODED_CLIENT_ID is replaced at deploy time by GitHub Actions.
//  The placeholder string is safe to commit — it contains no real secret.
// ============================================================
const HARDCODED_CLIENT_ID = '__SPOTIFY_CLIENT_ID__';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = [
  'user-read-private',
  'user-library-read',
  'playlist-read-private',
  'playlist-read-collaborative',
  'user-read-playback-state',
  'user-modify-playback-state',
  'streaming'
].join(' ');

// ============================================================
//  STATE
// ============================================================
let accessToken = null;
let tokenExpiry = 0;
let userId = null;
let playlists = [];
let selectedPlaylistId = null;
let selectedPlaylistName = '';

// Game state
let gameCards = [];
let gameIndex = 0;
let gameScore = 0;
let gameTimeline = [];
let pendingPlacementIndex = null;
let lastCard = null;
let currentTrackUri = null;
let isPlaying = false;
let deviceId = null;
let recommendedPlaylists = [];
let searchTimeout = null;

// Mode & token state
let gameMode = 'standard';
let tokens = 3;
let tokensEarned = 0;
let tokensSpent = 0;
let winTarget = 20;
let pendingArtistGuess = null;
let pendingTitleGuess = null;
let acTimers = {};

// Platform detection (iOS Safari cannot use Web Playback SDK)
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let spotifyPlayer = null;

// ============================================================
//  PKCE HELPERS
// ============================================================
function base64urlEncode(array) {
  return btoa(String.fromCharCode(...array))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return base64urlEncode(array);
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return base64urlEncode(new Uint8Array(digest));
}

async function exchangeCodeForToken(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  sessionStorage.removeItem('pkce_verifier');
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: HARDCODED_CLIENT_ID,
      code_verifier: verifier
    })
  });
  if (!res.ok) { console.error('Token exchange failed', await res.json().catch(() => ({}))); return null; }
  return res.json();
}

async function refreshAccessToken() {
  const refreshToken = localStorage.getItem('timelinefm_refresh_token');
  if (!refreshToken) return false;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: refreshToken,
      client_id: HARDCODED_CLIENT_ID
    })
  });
  if (!res.ok) return false;
  const data = await res.json();
  accessToken = data.access_token;
  tokenExpiry = Date.now() + data.expires_in * 1000;
  localStorage.setItem('timelinefm_token', accessToken);
  localStorage.setItem('timelinefm_token_expiry', tokenExpiry);
  if (data.refresh_token) localStorage.setItem('timelinefm_refresh_token', data.refresh_token);
  return true;
}

// ============================================================
//  INIT — handle OAuth callback or redirect to Spotify
// ============================================================
window.onload = async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    showError('Spotify login was cancelled or failed. Please try again.');
    return;
  }

  if (code) {
    window.history.replaceState({}, '', window.location.pathname);
    const tokenData = await exchangeCodeForToken(code);
    if (!tokenData) {
      showError('Failed to complete Spotify login. Please try again.');
      return;
    }
    accessToken = tokenData.access_token;
    tokenExpiry = Date.now() + tokenData.expires_in * 1000;
    localStorage.setItem('timelinefm_token', accessToken);
    localStorage.setItem('timelinefm_token_expiry', tokenExpiry);
    if (tokenData.refresh_token) localStorage.setItem('timelinefm_refresh_token', tokenData.refresh_token);
    await initApp();
    return;
  }

  const storedToken = localStorage.getItem('timelinefm_token');
  const storedExpiry = parseInt(localStorage.getItem('timelinefm_token_expiry') || '0');
  if (storedToken && Date.now() < storedExpiry - 30000) {
    accessToken = storedToken;
    tokenExpiry = storedExpiry;
    await initApp();
    return;
  }

  if (await refreshAccessToken()) {
    await initApp();
    return;
  }

  loginWithSpotify();
};

function showError(msg) {
  goTo('loading');
  document.getElementById('loading-spinner').style.display = 'none';
  document.getElementById('loading-text').style.display = 'none';
  document.getElementById('loading-error').style.display = 'block';
  document.getElementById('loading-error-msg').textContent = msg;
}

function getClientId() {
  return HARDCODED_CLIENT_ID;
}

async function loginWithSpotify() {
  const clientId = getClientId();
  if (!clientId || clientId === ('__SPOTIFY' + '_CLIENT_ID__')) {
    showError('No Spotify Client ID configured. Please deploy via GitHub Actions with the SPOTIFY_CLIENT_ID secret set.');
    return;
  }
  const verifier = await generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id', clientId);
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('scope', SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge', challenge);
  window.location = url.toString();
}

function logout() {
  localStorage.removeItem('timelinefm_token');
  localStorage.removeItem('timelinefm_token_expiry');
  localStorage.removeItem('timelinefm_refresh_token');
  accessToken = null;
  loginWithSpotify();
}

// ============================================================
//  SPOTIFY API HELPERS
// ============================================================
async function spotifyFetch(path, options = {}) {
  const res = await fetch('https://api.spotify.com/v1' + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (res.status === 401) {
    logout(); return null;
  }
  if (res.status === 204 || res.status === 202) return {};
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    console.warn('Spotify API error', res.status, err);
    return null;
  }
  return res.json().catch(() => ({}));
}

// ============================================================
//  APP INIT — fetch user + playlists
// ============================================================
async function initApp() {
  goTo('loading');
  try {
    const me = await spotifyFetch('/me');
    if (!me) return;
    userId = me.id;
    document.getElementById('user-name').textContent = me.display_name || me.id;
    if (me.images && me.images[0]) {
      document.getElementById('user-avatar').src = me.images[0].url;
    }

    await Promise.all([loadPlaylists(), loadRecommendedPlaylists()]);
    renderPlaylistGrid();
    initDevicePlayback();
    goTo('picker');
  } catch(e) {
    console.error(e);
    showError('Failed to connect to Spotify. Please try again.');
  }
}

async function loadPlaylists() {
  let allPlaylists = [];
  let url = '/me/playlists?limit=50';
  while (url) {
    const data = await spotifyFetch(url.startsWith('/') ? url : url.replace('https://api.spotify.com/v1',''));
    if (!data) break;
    allPlaylists = allPlaylists.concat(data.items || []);
    url = data.next ? data.next.replace('https://api.spotify.com/v1','') : null;
  }
  playlists = allPlaylists.filter(p => p && p.tracks && p.tracks.total > 0);
  // Prepend Liked Songs as a virtual playlist
  const likedData = await spotifyFetch('/me/tracks?limit=1');
  if (likedData && typeof likedData.total === 'number' && likedData.total > 0) {
    playlists.unshift({ id: '__liked__', name: '♥ Liked Songs', images: [], tracks: { total: likedData.total } });
  }
}

function playlistCardHtml(pl) {
  const img = pl.images && pl.images[0] ? pl.images[0].url : null;
  const icon = pl.id === '__liked__' ? '♥' : '♪';
  const imgEl = img
    ? `<img class="pl-img" src="${img}" alt="" loading="lazy">`
    : `<div class="pl-img-placeholder">${icon}</div>`;
  const total = pl.tracks ? pl.tracks.total : '?';
  return `<div class="pl-card ${selectedPlaylistId === pl.id ? 'selected' : ''}" data-id="${pl.id}" data-name="${escHtml(pl.name)}" onclick="selectPlaylist(this.dataset.id,this.dataset.name)">${imgEl}<div class="pl-info"><div class="pl-name">${escHtml(pl.name)}</div><div class="pl-count">${total} tracks</div></div></div>`;
}

function renderPlaylistGrid(searchResults = null) {
  const grid = document.getElementById('playlist-grid');
  if (searchResults !== null) {
    if (!searchResults.length) { grid.innerHTML = '<div class="empty-state">No playlists found.</div>'; return; }
    grid.innerHTML = '<div class="pl-section-label">Search Results</div>' + searchResults.map(playlistCardHtml).join('');
    return;
  }
  let html = '';
  if (recommendedPlaylists.length) {
    html += '<div class="pl-section-label">Recommended</div>' + recommendedPlaylists.map(playlistCardHtml).join('');
  }
  if (playlists.length) {
    html += '<div class="pl-section-label" style="padding-top:16px">My Playlists</div>' + playlists.map(playlistCardHtml).join('');
  }
  grid.innerHTML = html || '<div class="empty-state">No playlists found on your account.</div>';
  if (!selectedPlaylistId && playlists.length) selectPlaylist(playlists[0].id, playlists[0].name);
}

function selectPlaylist(id, name) {
  selectedPlaylistId = id;
  selectedPlaylistName = name;
  document.querySelectorAll('.pl-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.id === id);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
//  PLAYBACK — Web Playback SDK on desktop, REST API on iOS
// ============================================================
function initDevicePlayback() {
  if (isIOS) {
    // iOS Safari: use Spotify Connect REST API (requires Spotify app open)
    refreshDevices();
  } else {
    // Desktop: load Web Playback SDK (creates virtual device in browser)
    loadSpotifySDK();
    const btn = document.getElementById('refresh-devices-btn');
    if (btn) btn.style.display = 'none';
  }
}

function loadSpotifySDK() {
  const statusEl = document.getElementById('player-status');
  if (statusEl) statusEl.textContent = 'Loading player…';
  window.onSpotifyWebPlaybackSDKReady = () => {
    spotifyPlayer = new Spotify.Player({
      name: 'Timeline FM',
      getOAuthToken: cb => cb(accessToken),
      volume: 0.8
    });
    spotifyPlayer.addListener('ready', ({ device_id }) => {
      deviceId = device_id;
      const s = document.getElementById('player-status');
      if (s) s.textContent = '▶ Ready';
    });
    spotifyPlayer.addListener('not_ready', () => {
      deviceId = null;
      const s = document.getElementById('player-status');
      if (s) s.textContent = 'Player disconnected — reload page';
    });
    spotifyPlayer.addListener('initialization_error', ({ message }) => console.error('SDK init:', message));
    spotifyPlayer.addListener('authentication_error', ({ message }) => console.error('SDK auth:', message));
    spotifyPlayer.addListener('account_error', () => {
      const s = document.getElementById('player-status');
      if (s) s.textContent = 'Spotify Premium required';
    });
    spotifyPlayer.connect();
  };
  const script = document.createElement('script');
  script.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(script);
}

async function refreshDevices() {
  const statusEl = document.getElementById('player-status');
  if (statusEl) statusEl.textContent = 'Looking for Spotify…';
  const data = await spotifyFetch('/me/player/devices');
  if (!data || !data.devices || !data.devices.length) {
    deviceId = null;
    if (statusEl) statusEl.textContent = 'No devices found';
    return null;
  }
  // Prefer active device; fall back to first available
  const active = data.devices.find(d => d.is_active) || data.devices[0];
  deviceId = active.id;
  if (statusEl) statusEl.textContent = (active.is_active ? '▶ ' : '📱 ') + active.name;
  hideNoDeviceBanner();
  return active;
}

function showNoDeviceBanner() {
  const b = document.getElementById('no-device-banner');
  if (b) b.style.display = 'flex';
  const playBtn = document.getElementById('play-btn');
  if (playBtn) playBtn.disabled = true;
}

function hideNoDeviceBanner() {
  const b = document.getElementById('no-device-banner');
  if (b) b.style.display = 'none';
  const playBtn = document.getElementById('play-btn');
  if (playBtn) playBtn.disabled = false;
}

async function retryDevices() {
  const device = await refreshDevices();
  // If a track is loaded but paused due to no device, auto-play after finding one
  if (device && currentTrackUri && !isPlaying) {
    await playTrack(currentTrackUri);
  }
}

async function playTrack(uri) {
  currentTrackUri = uri;
  if (!uri) return;

  // On desktop the SDK manages deviceId directly — skip REST device lookup if already ready
  if (!spotifyPlayer) {
    // REST path (iOS or SDK not yet ready): always re-query devices before playing
    const statusEl = document.getElementById('player-status');
    if (statusEl) statusEl.textContent = 'Finding device…';
    const data = await spotifyFetch('/me/player/devices');
    if (!data || !data.devices || !data.devices.length) {
      deviceId = null;
      showNoDeviceBanner();
      if (statusEl) statusEl.textContent = 'No device found';
      return;
    }
    hideNoDeviceBanner();
    const active = data.devices.find(d => d.is_active);
    const any = data.devices[0];
    if (active) {
      deviceId = active.id;
    } else {
      // Found a device but it's not active — transfer playback to wake it
      deviceId = any.id;
      if (statusEl) statusEl.textContent = '⚡ Waking ' + any.name + '…';
      await spotifyFetch('/me/player', {
        method: 'PUT',
        body: JSON.stringify({ device_ids: [deviceId], play: false })
      });
      await new Promise(r => setTimeout(r, 800));
    }
    if (statusEl) statusEl.textContent = '♫ Playing…';
  }

  if (!deviceId) {
    showNoDeviceBanner();
    return;
  }

  document.getElementById('vinyl-disc').classList.add('playing');
  const statusEl = document.getElementById('player-status');
  if (statusEl) statusEl.textContent = '♫ Playing…';
  await spotifyFetch(`/me/player/play?device_id=${deviceId}`, {
    method: 'PUT',
    body: JSON.stringify({ uris: [uri], position_ms: 30000 })
  });
  isPlaying = true;
  document.getElementById('play-btn').textContent = '⏸';
}

async function stopPlayback() {
  isPlaying = false;
  document.getElementById('play-btn').textContent = '▶';
  document.getElementById('vinyl-disc').classList.remove('playing');
  if (isIOS) return; // never interrupt playback on iOS
  if (spotifyPlayer) {
    spotifyPlayer.pause().catch(() => {});
  } else if (deviceId) {
    await spotifyFetch('/me/player/pause', { method: 'PUT' }).catch(() => {});
  }
}

async function togglePlayback() {
  if (isPlaying) {
    await stopPlayback();
  } else if (currentTrackUri) {
    await playTrack(currentTrackUri);
  }
}

// ============================================================
//  GAME — SETUP
// ============================================================
async function startGame() {
  if (!selectedPlaylistId) { alert('Please select a playlist.'); return; }
  stopPlayback();
  goTo('loading');
  document.getElementById('loading-spinner').style.display = '';
  document.getElementById('loading-text').style.display = '';
  document.getElementById('loading-error').style.display = 'none';
  document.getElementById('loading-text').textContent = 'Loading tracks…';

  // Fetch all tracks from playlist (or Liked Songs)
  const isLikedPlaylist = selectedPlaylistId === '__liked__';
  let tracks = [];
  let url = isLikedPlaylist
    ? '/me/tracks?limit=50&fields=next,items(track(id,name,uri,external_ids,album(release_date,images),artists(name)))'
    : `/playlists/${selectedPlaylistId}/tracks?limit=100&fields=next,items(track(id,name,uri,external_ids,album(release_date,images),artists(name)))`;
  while (url) {
    const data = await spotifyFetch(url);
    if (!data) break;
    const valid = (data.items || [])
      .filter(i => i.track && i.track.uri && i.track.album && i.track.album.release_date)
      .map(i => {
        const year = parseInt(i.track.album.release_date.substring(0,4));
        return {
          id: i.track.id,
          uri: i.track.uri,
          title: i.track.name,
          artist: i.track.artists.map(a => a.name).join(', '),
          year,
          albumArt: i.track.album.images[0] ? i.track.album.images[0].url : null,
          isrc: (i.track.external_ids && i.track.external_ids.isrc) || null
        };
      })
      .filter(t => t.year >= 1900 && t.year <= 2025);
    tracks = tracks.concat(valid);
    url = data.next ? data.next.replace('https://api.spotify.com/v1','') : null;
  }

  if (tracks.length < 3) {
    alert('Not enough valid tracks with release dates in this playlist (need at least 3). Try another playlist.');
    goTo('picker');
    return;
  }

  // Fisher-Yates shuffle for uniform randomness
  for (let i = tracks.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
  }
  const poolSize = Math.min(parseInt(document.getElementById('num-pool').value) || 50, tracks.length);
  winTarget = Math.min(parseInt(document.getElementById('num-win').value) || 20, poolSize - 1);
  gameCards = tracks.slice(0, poolSize);

  gameIndex = 0;
  gameScore = 0;
  gameTimeline = [];
  pendingPlacementIndex = null;
  pendingArtistGuess = null;
  pendingTitleGuess = null;
  lastCard = null;
  tokens = 3;
  tokensEarned = 0;
  tokensSpent = 0;

  // Enrich the anchor card's year before placing it
  if (gameCards[0].isrc) {
    gameCards[0].mbChecked = true;
    const mbYear = await mbLookup(gameCards[0].isrc);
    if (mbYear !== null) gameCards[0].year = mbYear;
  }
  // Auto-place the first card as a visible reference point
  gameTimeline.push({...gameCards[0]});
  gameIndex = 1;

  document.getElementById('g-pl-name').textContent = selectedPlaylistName;
  updateScore();
  updateTokenDisplay();
  goTo('game');
  await loadCard();
}

// ============================================================
//  MUSICBRAINZ ISRC YEAR ENRICHMENT
// ============================================================
async function mbLookup(isrc) {
  try {
    const res = await fetch(
      `https://musicbrainz.org/ws/2/recording?isrc=${encodeURIComponent(isrc)}&inc=releases&fmt=json`,
      { headers: { 'User-Agent': 'TimelineFM/1.0 (game)' } }
    );
    if (!res.ok) return null;
    const data = await res.json();
    const years = [];
    for (const rec of (data.recordings || [])) {
      for (const rel of (rec.releases || [])) {
        if (rel.date) {
          const y = parseInt(rel.date.substring(0, 4));
          if (y >= 1900 && y <= 2025) years.push(y);
        }
      }
    }
    return years.length ? Math.min(...years) : null;
  } catch { return null; }
}

async function enrichYearsFromMusicBrainz(cards) {
  // Process in batches of 5 to avoid hammering the free API
  const BATCH = 5;
  const DELAY = 350; // ms between batches (MusicBrainz rate limit: 1 req/s per IP, batching helps)
  for (let i = 0; i < cards.length; i += BATCH) {
    const batch = cards.slice(i, i + BATCH);
    await Promise.all(batch.map(async card => {
      if (!card.isrc) return;
      const mbYear = await mbLookup(card.isrc);
      if (mbYear !== null) card.year = mbYear;
    }));
    if (i + BATCH < cards.length) await new Promise(r => setTimeout(r, DELAY));
  }
}

// ============================================================
//  GAME — CARD LOGIC
// ============================================================
async function loadCard() {
  if (gameIndex >= gameCards.length) { endGame(); return; }
  const card = gameCards[gameIndex];
  // Lazy MusicBrainz year correction — done once per card just before it's shown
  if (card.isrc && !card.mbChecked) {
    card.mbChecked = true;
    const mbYear = await mbLookup(card.isrc);
    if (mbYear !== null) card.year = mbYear;
  }
  pendingPlacementIndex = null;
  pendingArtistGuess = null;
  pendingTitleGuess = null;
  isPlaying = false;
  updateTokenDisplay();

  // Counter
  const counter = document.getElementById('g-counter');
  counter.textContent = `${gameIndex}/${gameCards.length - 1}`;
  counter.style.color = gameMode === 'hardcore' ? 'var(--red)' : '';

  // Obscure all song info until the player locks in their guess
  const titleEl = document.getElementById('g-title');
  titleEl.textContent = '• • • • •';
  titleEl.style.opacity = '0.25';
  const artistEl = document.getElementById('g-artist');
  artistEl.textContent = '• • •';
  artistEl.style.opacity = '0.2';
  document.getElementById('g-year').classList.add('hidden');

  const disc = document.getElementById('vinyl-disc');
  disc.classList.add('hidden-label');
  disc.classList.remove('spinning', 'playing');
  document.getElementById('lbl-title').textContent = '?';
  document.getElementById('lbl-year').textContent = '????';
  document.getElementById('vinyl-wrap').style.display = '';

  const art = document.getElementById('album-art');
  art.classList.remove('visible');
  if (card.albumArt) { art.src = card.albumArt; }
  const revArt = document.getElementById('revealed-art');
  revArt.style.display = 'none';
  revArt.src = '';

  document.getElementById('result-banner').className = 'result-banner';
  document.getElementById('player-status').textContent = 'Ready to play';
  document.getElementById('play-btn').textContent = '▶';
  document.getElementById('play-btn').disabled = false;

  currentTrackUri = card.uri;
  playTrack(card.uri);

  setControls('place-hint');
  renderTimeline(true);
}

function setControls(mode) {
  const el = document.getElementById('game-controls');
  const guessBlock = gameMode === 'standard' ? `
    <div style="width:100%;max-width:340px;margin-bottom:10px">
      <div style="font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:8px">Guess for +1 token (optional)</div>
      <div class="ac-wrap" style="margin-bottom:6px">
        <input class="ac-input" id="ac-artist" type="text" placeholder="Artist name…" value="${escHtml(pendingArtistGuess||'')}" oninput="onAcInput('artist',this.value)" autocomplete="off">
        <div class="ac-dropdown" id="ac-artist-drop"></div>
      </div>
      <div class="ac-wrap">
        <input class="ac-input" id="ac-title" type="text" placeholder="Song title…" value="${escHtml(pendingTitleGuess||'')}" oninput="onAcInput('title',this.value)" autocomplete="off">
        <div class="ac-dropdown" id="ac-title-drop"></div>
      </div>
    </div>` : '';
  if (mode === 'place-hint') {
    el.innerHTML = guessBlock + `<div style="font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.08em;text-align:center;padding:4px 0">↑ Tap a gap in the timeline to place your guess ↑</div>`;
  } else if (mode === 'confirm') {
    el.innerHTML = guessBlock + `
      <div style="font-size:11px;color:var(--teal);letter-spacing:0.08em;text-align:center;padding:4px 0">Tap another gap to move — or lock it in</div>
      <div class="controls-row"><button class="btn btn-primary" onclick="confirmPlacement()">✓ &nbsp;Lock In</button></div>`;
  } else if (mode === 'next') {
    el.innerHTML = `<div class="controls-row"><button class="btn btn-primary" onclick="nextCard()">Next Song →</button></div>`;
  } else {
    el.innerHTML = '';
  }
}

function tentativePlaceCard(insertIndex) {
  if (gameMode === 'standard') {
    const ae = document.getElementById('ac-artist');
    const te = document.getElementById('ac-title');
    if (ae) pendingArtistGuess = ae.value;
    if (te) pendingTitleGuess = te.value;
  }
  pendingPlacementIndex = insertIndex;
  setControls('confirm');
  renderTimeline(true);
}

function confirmPlacement() {
  if (pendingPlacementIndex === null) return;
  // Capture latest input values before rebuilding UI
  if (gameMode === 'standard') {
    const ae = document.getElementById('ac-artist');
    const te = document.getElementById('ac-title');
    if (ae) pendingArtistGuess = ae.value;
    if (te) pendingTitleGuess = te.value;
  }
  const card = gameCards[gameIndex];
  const sorted = getSorted();
  const insertIndex = pendingPlacementIndex;

  const prev = insertIndex > 0 ? sorted[insertIndex - 1] : null;
  const next = insertIndex < sorted.length ? sorted[insertIndex] : null;
  const correct = !(prev && card.year < prev.year) && !(next && card.year > next.year);

  // Reveal all song info
  const titleEl = document.getElementById('g-title');
  titleEl.textContent = card.title;
  titleEl.style.opacity = '';
  const artistEl = document.getElementById('g-artist');
  artistEl.textContent = card.artist;
  artistEl.style.opacity = '';
  document.getElementById('g-year').textContent = card.year;
  document.getElementById('g-year').classList.remove('hidden');
  document.getElementById('album-art').classList.add('visible');
  const revArt = document.getElementById('revealed-art');
  if (card.albumArt) { revArt.src = card.albumArt; revArt.style.display = ''; }

  // Hide the vinyl disc — show only the album art once locked in
  document.getElementById('vinyl-wrap').style.display = 'none';

  pendingPlacementIndex = null;

  // Check name bonus (standard only: both artist AND title must be correct)
  const guessAttempted = gameMode === 'standard' && !!(pendingArtistGuess || pendingTitleGuess);
  let nameBonus = false;
  if (gameMode === 'standard' && pendingArtistGuess && pendingTitleGuess) {
    const cardArtists = card.artist.toLowerCase().split(/,\s*/);
    const artistOk = cardArtists.some(a => a === pendingArtistGuess.trim().toLowerCase());
    const titleOk = pendingTitleGuess.trim().toLowerCase() === card.title.toLowerCase();
    if (artistOk && titleOk) {
      nameBonus = true;
      tokens++;
      tokensEarned++;
    }
  }
  const guessFeedback = !guessAttempted ? '' : nameBonus ? ' · +♥ Guess correct!' : ' · Guess wrong';
  pendingArtistGuess = null;
  pendingTitleGuess = null;

  if (correct) {
    gameTimeline.push({...card, justPlaced: true});
    gameScore++;
    updateScore();
    if (gameScore >= winTarget) {
      showResult(true, `✓ Perfect Run!${guessFeedback}`);
      renderTimeline(false);
      setTimeout(() => endGame(), 1500);
    } else {
      showResult(true, `✓ Correct!${guessFeedback}`);
      setControls('next');
      renderTimeline(false);
    }
  } else {
    lastCard = {...card, guessedAfter: prev ? prev.year : null, guessedBefore: next ? next.year : null};
    if (gameMode === 'hardcore') {
      showResult(false, `✗ Wrong! Eliminated${guessFeedback}`);
      document.getElementById('game-controls').innerHTML = '';
      renderTimeline(false);
      setTimeout(() => endGame(), 1800);
    } else {
      tokens--;
      tokensSpent++;
      updateTokenDisplay();
      if (tokens <= 0) {
        showResult(false, `✗ Wrong — no tokens left!${guessFeedback}`);
        document.getElementById('game-controls').innerHTML = '';
        renderTimeline(false);
        setTimeout(() => endGame(), 1800);
      } else {
        showResult(false, `✗ Wrong — ${tokens} heart${tokens !== 1 ? 's' : ''} left${guessFeedback}`);
        setControls('next');
        renderTimeline(false);
      }
    }
  }
}

async function nextCard() {
  // Clear justPlaced flags
  gameTimeline.forEach(c => delete c.justPlaced);
  gameIndex++;
  await loadCard();
}

function showResult(ok, msg) {
  const el = document.getElementById('result-banner');
  el.textContent = msg;
  el.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
}

function updateScore() { document.getElementById('g-score').textContent = gameScore; updateTokenDisplay(); }
function getSorted() { return [...gameTimeline].sort((a,b) => a.year - b.year); }

function endGame() {
  const titleEl = document.getElementById('go-title');
  const scoreEl = document.getElementById('go-score');
  const ctxEl = document.getElementById('go-context');
  const elimEl = document.getElementById('go-eliminated-card');
  const tokenStatsEl = document.getElementById('go-token-stats');
  const survived = gameScore;
  const isPerfect = survived >= winTarget;

  document.getElementById('go-mode').textContent = gameMode === 'standard' ? 'Standard Mode' : 'Hardcore Mode';

  if (isPerfect) {
    stopPlayback();
    titleEl.textContent = 'PERFECT RUN';
    titleEl.style.textShadow = '5px 5px 0 var(--teal)';
    scoreEl.textContent = survived;
    ctxEl.textContent = `All ${winTarget} songs placed correctly!`;
    elimEl.style.display = 'none';
    tokenStatsEl.style.display = 'none';
    document.getElementById('go-playlist').style.display = 'none';
  } else {
    titleEl.textContent = 'ELIMINATED';
    titleEl.style.textShadow = '5px 5px 0 var(--red)';
    scoreEl.textContent = survived;
    ctxEl.textContent = `${survived} / ${winTarget} songs placed correctly`;
    const plEl = document.getElementById('go-playlist');
    plEl.textContent = selectedPlaylistName;
    plEl.style.display = '';
    if (gameMode === 'standard') {
      tokenStatsEl.innerHTML = `♥ &nbsp;+${tokensEarned} earned &nbsp;·&nbsp; ${tokensSpent} spent &nbsp;·&nbsp; ${Math.max(0, tokens)} remaining`;
      tokenStatsEl.style.display = '';
    } else {
      tokenStatsEl.style.display = 'none';
    }
    if (lastCard) {
      const artHtml = lastCard.albumArt
        ? `<img src="${lastCard.albumArt}" style="width:100px;height:100px;object-fit:cover;border-radius:4px;box-shadow:4px 4px 0 rgba(0,0,0,0.5);margin-bottom:10px">`
        : '';
      const rangeFrom = lastCard.guessedAfter != null ? lastCard.guessedAfter : null;
      const rangeTo = lastCard.guessedBefore != null ? lastCard.guessedBefore : null;
      const rangeStr = rangeFrom != null && rangeTo != null ? `${rangeFrom} – ${rangeTo}`
        : rangeFrom != null ? `after ${rangeFrom}`
        : rangeTo != null ? `before ${rangeTo}`
        : null;
      const guessRangeHtml = rangeStr
        ? `<div style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.12em;margin-top:8px">YOU GUESSED: <span style="color:rgba(255,255,255,0.55)">${rangeStr}</span></div>`
        : '';
      elimEl.innerHTML = `${artHtml}<div style="font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:6px">the song that got you</div><div style="font-family:'Playfair Display',serif;font-style:italic;font-size:18px;margin-bottom:4px">${escHtml(lastCard.title)}</div><div style="font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:6px">${escHtml(lastCard.artist)}</div><div style="font-family:'Bebas Neue',cursive;font-size:36px;color:var(--gold)">${lastCard.year}</div>${guessRangeHtml}`;
      elimEl.style.display = 'block';
    } else {
      elimEl.style.display = 'none';
    }
  }
  goTo('gameover');
}

function quitGame() {
  if (confirm('Quit this game?')) { stopPlayback(); goTo('picker'); }
}

// ============================================================
//  TIMELINE RENDERING
// ============================================================
function renderTimeline(interactive = false) {
  const sorted = getSorted();
  const container = document.getElementById('timeline');

  const mkDrop = (slotIdx, label) => {
    if (interactive && pendingPlacementIndex === slotIdx) {
      // Ghost card — shows tentative placement position
      return `<div class="t-card t-card-ghost" style="border:2px solid var(--teal);background:rgba(29,185,84,0.1);cursor:default;flex-shrink:0;">
        <div class="t-vinyl"></div>
        <div class="t-year" style="color:var(--teal)">????</div>
        <div class="t-title" style="color:rgba(29,185,84,0.8)">here?</div>
      </div>`;
    }
    return interactive
      ? `<div class="drop-zone active" onclick="tentativePlaceCard(${slotIdx})" title="${label}">+</div>`
      : '';
  };

  let html = mkDrop(0, sorted.length ? `Before ${sorted[0].year}` : 'Place here');

  sorted.forEach((card, i) => {
    const color = yearToColor(card.year);
    const bgStyle = card.albumArt
      ? `background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.82)),url(${card.albumArt}) center/cover no-repeat`
      : `background:linear-gradient(180deg,${color}33 0%,rgba(0,0,0,0.8) 100%)`;
    html += `<div class="t-card ${card.justPlaced ? 'just-placed' : ''}" style="border-top:3px solid ${color};${bgStyle};flex-shrink:0;">
      <div class="t-year" style="color:${color}">${card.year}</div>
      <div class="t-title">${escHtml(card.title)}</div>
      <div class="t-artist">${escHtml(card.artist)}</div>
    </div>`;
    // Only show a drop zone if the next card has a different year (no point placing between same-year cards)
    const nextCard = sorted[i + 1];
    if (!nextCard || nextCard.year !== card.year) {
      html += mkDrop(i + 1, `After ${card.year}`);
    }
  });

  const inner = html || `<div style="font-size:11px;color:rgba(255,255,255,0.2);padding:0 4px">—</div>`;
  const prevScroll = container.scrollLeft;
  const wasAtEnd = container.scrollLeft + container.clientWidth >= container.scrollWidth - 4;
  container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;min-width:max-content;padding:0 8px">${inner}</div>`;
  // Auto-scroll to end only on first load (empty timeline) or when player was already at the end
  if (wasAtEnd || prevScroll === 0) {
    container.scrollLeft = container.scrollWidth;
  } else {
    container.scrollLeft = prevScroll;
  }
}

function yearToColor(year) {
  const pct = Math.max(0, Math.min(1, (year - 1950) / 70));
  const hue = Math.round(30 + pct * 150); // orange(30) → teal(180)
  return `hsl(${hue}, 75%, 58%)`;
}

// ============================================================
//  ARTIST / TITLE AUTOCOMPLETE
// ============================================================
function onAcInput(type, val) {
  if (type === 'artist') pendingArtistGuess = val;
  else pendingTitleGuess = val;
  clearTimeout(acTimers[type]);
  const dropId = type === 'artist' ? 'ac-artist-drop' : 'ac-title-drop';
  if (!val.trim()) { const d = document.getElementById(dropId); if (d) d.style.display = 'none'; return; }
  if (val.trim().length < 3) return;
  acTimers[type] = setTimeout(() => acSearch(type, val.trim()), 160);
}

async function acSearch(type, query) {
  const dropId = type === 'artist' ? 'ac-artist-drop' : 'ac-title-drop';
  const drop = document.getElementById(dropId);
  if (!drop) return;
  const data = await spotifyFetch(`/search?type=${type === 'artist' ? 'artist' : 'track'}&q=${encodeURIComponent(query)}&limit=12`);
  if (!data) return;
  const items = type === 'artist'
    ? (data.artists ? data.artists.items : [])
    : (data.tracks ? data.tracks.items : []);
  if (!items || !items.length) { drop.style.display = 'none'; return; }
  const seen = new Set();
  const q = query.toLowerCase();
  const deduped = items.filter(item => {
    const key = item.name.toLowerCase();
    // Only include items whose name actually contains the query string
    if (!key.includes(q)) return false;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  drop.innerHTML = deduped.slice(0, 6).map(item =>
    `<div class="ac-item" data-type="${type}" data-value="${escHtml(item.name)}" onclick="selectAcFromEl(this)">${escHtml(item.name)}</div>`
  ).join('');
  drop.style.display = 'block';
}

function selectAcFromEl(el) {
  const type = el.dataset.type;
  const value = el.dataset.value;
  if (type === 'artist') {
    pendingArtistGuess = value;
    const inp = document.getElementById('ac-artist');
    if (inp) inp.value = value;
    document.getElementById('ac-artist-drop').style.display = 'none';
  } else {
    pendingTitleGuess = value;
    const inp = document.getElementById('ac-title');
    if (inp) inp.value = value;
    document.getElementById('ac-title-drop').style.display = 'none';
  }
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.ac-wrap')) {
    document.querySelectorAll('.ac-dropdown').forEach(d => d.style.display = 'none');
  }
});

// ============================================================
//  NAVIGATION

function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
